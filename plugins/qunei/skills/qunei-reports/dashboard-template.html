<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ENTITY}} · {{PERIOD}}</title>
<style>
  /*
    Palette tokens mirror app/assets/stylesheets/site.css (the qunei
    terracotta brand system) so generated dashboards match the web
    shell. Change the palette there first, then sync the values here
    verbatim -- site.css's header comment carries the computed WCAG
    ratios. --accent (the AA-safe deepened clay, unused by the base
    template) is the one sanctioned accent for filled-in content; the
    raw brand clay is deliberately not carried over, since it fails AA
    for text and this template has no non-text marks for it to color.
  */
  :root {
    color-scheme: light dark;
    --bg: #F3E9D8;
    --fg: #5C4938;
    --heading: #3A241C;
    --muted: #6F5A4E;
    --border: rgba(58, 36, 28, 0.22);
    --card-bg: #ffffff;
    --accent: #A04E26;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241511;
      --fg: #C8B89E;
      --heading: #F3E9D8;
      --muted: #A89378;
      --border: rgba(243, 233, 216, 0.16);
      --card-bg: #3A241C;
      --accent: #D98F63;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    max-width: 860px;
    margin-inline: auto;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    line-height: 1.5;
  }
  h1, h2 {
    font-family: var(--font-serif);
    font-weight: 600;
    line-height: 1.2;
    color: var(--heading);
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  .period { color: var(--muted); margin: 0 0 2rem; }
  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    min-width: 180px;
  }
  .stat .label {
    color: var(--muted);
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .stat .value { font-size: 1.5rem; font-weight: 600; margin-top: .25rem; }
  section { margin-bottom: 2rem; }
  h2 {
    font-size: 1.1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: .5rem;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
  th.amount, td.amount { text-align: right; font-variant-numeric: tabular-nums; }
  footer {
    color: var(--muted);
    font-size: .8rem;
    margin-top: 3rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>{{ENTITY}}</h1>
  <p class="period">{{PERIOD}}</p>
</header>

<div class="stat-row">
  <div class="stat">
    <div class="label">Cash position</div>
    <div class="value">{{CASH_POSITION}}</div>
  </div>
</div>

<section>
  <h2>Profit &amp; loss</h2>
  <table>
    <thead>
      <tr><th>Account</th><th class="amount">Amount</th></tr>
    </thead>
    <!--
      PL_ROWS: replace this token with one <tr> per P&L line, e.g.

        <tr><td>Income:Sales</td><td class="amount">$4,200.00</td></tr>
        <tr><td>Expenses:Rent</td><td class="amount">$1,200.00</td></tr>

      Add a totals row the same way if you want one. This token sits
      directly inside <tbody>, so any well-formed sequence of
      <tr>...</tr> fragments produces valid HTML here.
    -->
    <tbody>{{PL_ROWS}}</tbody>
  </table>
</section>

<section>
  <h2>Top movers</h2>
  <table>
    <thead>
      <tr><th>Account</th><th class="amount">Change vs prior period</th></tr>
    </thead>
    <!--
      TOP_MOVERS: replace this token with one <tr> per account,
      largest absolute change first, e.g.

        <tr><td>Expenses:Freight</td><td class="amount">+$340.00</td></tr>
        <tr><td>Income:Sales</td><td class="amount">-$150.00</td></tr>

      Same rule as PL_ROWS above: plain <tr>...</tr> fragments
      directly inside <tbody>.
    -->
    <tbody>{{TOP_MOVERS}}</tbody>
  </table>
</section>

<section>
  <h2>Pending drafts</h2>
  <!--
    PENDING_DRAFTS: this section is not a table -- replace this
    token with plain text or a short list, e.g. "3 drafts awaiting
    approval" or a <ul><li>...</li></ul> summary built from
    list_drafts. No <tr> fragment expected here.
  -->
  <div>{{PENDING_DRAFTS}}</div>
</section>

<footer>
  Generated by Qunei from the ledger at {{GENERATED_AT}}
</footer>

</body>
</html>
